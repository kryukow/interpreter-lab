name: Interpreter Lab iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interpreter-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check independent application boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          yml = Path("project.yml").read_text()
          assert "org.interpreter.lab" in yml
          assert "InterpreterLab" in yml
          assert "NSSpeechRecognitionUsageDescription" in yml
          assert "NSMicrophoneUsageDescription" in yml
          code = "\n".join(p.read_text() for p in Path("App").glob("*.swift"))
          assert "AVSpeechSynthesizer" in code
          assert "SFSpeechRecognizer" in code
          assert "/v1/responses" in code
          assert "api.openai.com/v1/audio" not in code
          assert "RealtimeTranslation" not in code
          assert "chatgpt.tokens.use.direct" in code
          assert "InterpreterLab.ChatGPT" in code
          assert "LabTranslator.translate" in code
          print("Lab is an independent speech-to-text / text-translation / TTS app")
          PY
      - name: Validate subscription request contract and SSE parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code = Path("App/LabTranslator.swift").read_text()
          assert '"stream": true' in code and '"store": false' in code
          assert '"input": [["role": "user", "content": bounded]]' in code
          assert "URLSession.shared.bytes(for: request)" in code
          assert "LabResponseStream" in code
          print("Sign in with ChatGPT Responses contract checked")
          PY
          swiftc App/LabResponseStream.swift Tests/StreamTests.swift -o "$RUNNER_TEMP/lab-stream-tests"
          "$RUNNER_TEMP/lab-stream-tests"
      - name: Test long dictation and partial-result accumulation
        run: |
          swiftc App/LabTranscriptAssembler.swift Tests/TranscriptAssemblerTests.swift -o "$RUNNER_TEMP/lab-dictation-tests"
          "$RUNNER_TEMP/lab-dictation-tests"
          python3 - <<'PY'
          from pathlib import Path
          capture = Path("App/LabSpeechCapture.swift").read_text()
          assert "LabTranscriptAssembler" in capture
          assert "beginRecognitionSegment(token: token)" in capture
          assert "self.rotateSegment(token: token)" in capture
          assert ".seconds(42)" in capture
          assert ".seconds(55)" not in capture
          assert "relay.send(buffer)" in capture
          translate = Path("App/LabTranslator.swift").read_text()
          assert "let bounded = input" in translate
          assert "inputTooLong" in translate
          print("Long speech rollover and preservation contracts passed")
          PY
      - name: Validate ElevenLabs voice and billing boundaries
        run: |
          swiftc App/LabElevenAPI.swift App/LabElevenCatalog.swift Tests/ElevenAPITests.swift -o "$RUNNER_TEMP/eleven-tests"
          "$RUNNER_TEMP/eleven-tests"
          python3 - <<'PY'
          from pathlib import Path
          client = Path("App/LabElevenAPI.swift").read_text()
          session = Path("App/LabSession.swift").read_text()
          settings = Path("App/LabSettings.swift").read_text()
          keychain = Path("App/LabElevenKeychain.swift").read_text()
          assert "api.elevenlabs.io/v2/voices" in client
          assert "api.elevenlabs.io/v1/text-to-speech/" in client
          assert '"xi-api-key"' in client
          assert '"eleven_flash_v2_5"' in client and '"eleven_multilingual_v2"' in client
          assert "LabElevenKeychain.load()" in session
          assert "cachedEleven" in session
          assert "playRegularAppleVoice" in session
          assert "elevenAutoGenerate" in session
          assert 'speechEngine != "elevenlabs" || self.elevenAutoGenerate' in session
          assert "Озвучить ElevenLabs · расход кредитов" in session
          assert "SecItemAdd" in keychain and "WhenUnlockedThisDeviceOnly" in keychain
          assert "elevenKeyInput" in settings and "SecureField(" in settings
          print("ElevenLabs BYOK / no charges by default / Apple fallback verified")
          PY
      - name: Test original Live language orbit bindings
        run: |
          swiftc App/PartnerLanguage.swift App/LabLanguageBridge.swift Tests/LanguageTests.swift -o "$RUNNER_TEMP/lab-language-tests"
          "$RUNNER_TEMP/lab-language-tests"
      - name: Test Graphite voice-reactive frequency bands
        run: |
          swiftc App/LabAudioBands.swift Tests/AudioBandsTests.swift -o "$RUNNER_TEMP/lab-bands-tests"
          "$RUNNER_TEMP/lab-bands-tests"
      - name: Test phase motion contracts
        run: |
          swiftc App/LabResonanceStyle.swift Tests/ResonanceStyleTests.swift -o "$RUNNER_TEMP/lab-style-tests"
          "$RUNNER_TEMP/lab-style-tests"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify approved sphere and independent application assets
        run: |
          test "$(git hash-object App/Assets.xcassets/AppIcon.appiconset/AppIcon.png)" = "1d73c2940a09f8c075691f5ee31220661f77a1f5"
          test "$(git hash-object App/PartnerLanguage.swift)" = "b0fb10c6b714adb6f3ce66a7d0760b0d35d8a44d"
          test "$(git hash-object App/MicrophoneWaveform.swift)" = "3de2400c0d5a2a291ae7752c0ce18c0d48d14aa0"
          python3 - <<'PY'
          from pathlib import Path
          ui = Path("App/LabView.swift").read_text()
          assert "PressButton(title: title" in ui
          assert "LabGraphiteSignalView(" in ui
          assert "signal: model.visualSignal" in ui
          assert "LabWaveformSignalView(" not in ui
          assert 'Text("Русский ↔")' not in ui
          assert "LabGraphiteSelectionSheet(" in ui
          resonance = Path("App/LabGraphiteResonance.swift").read_text()
          assert "UIViewRepresentable" in resonance
          assert "CADisplayLink" in resonance
          assert "maximum: 30" in resonance
          assert "targetEnergy" in resonance
          assert "UIApplication.didBecomeActiveNotification" in resonance
          assert "UIApplication.didEnterBackgroundNotification" in resonance
          assert "makeConcept03InfinityPath" not in resonance
          assert "TimelineView(" not in resonance
          button = Path("App/PressButton.swift").read_text()
          assert "GraphitePressControl" in button
          assert "touchDown" in button and "touchCancel" in button
          audio = Path("App/LabSpeechExporter.swift").read_text()
          assert "synth.write(utterance)" in audio
          assert "LabPlaybackSpectrum" in audio
          session = Path("App/LabSession.swift").read_text()
          assert "startPlaybackMeter(token: token" in session
          assert "lastMicrophoneVisualUpdate >= 0.05" in session
          assert "milliseconds(50)" in session
          assert "playRegularAppleVoice" in session
          assert "model.setPartner" in ui
          settings = Path("App/LabSettings.swift").read_text()
          assert "LabSettingsCard" in settings
          assert "if model.chatGPTAccount.isEmpty {" in settings
          assert ".navigationBarTitleDisplayMode(.inline)" in settings
          console = Path("App/LabTranscriptConsole.swift").read_text()
          assert "LabFollowingTextView" in console and "contentSize.height - bounds.height" in console
          assert "LabLiveTextView" in console
          print("Independent artwork, lifecycle and transcription UI checked")
          PY
      - name: Generate iOS project
        run: xcodegen generate
      - name: Build iOS Simulator
        run: |
          xcodebuild -project InterpreterLab.xcodeproj -scheme InterpreterLab \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/LabSimulator" CODE_SIGNING_ALLOWED=NO build
      - name: Build for iPhone
        run: |
          xcodebuild -project InterpreterLab.xcodeproj -scheme InterpreterLab \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/LabDevice" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify product and package unsigned IPA
        run: |
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          app = Path(os.environ["RUNNER_TEMP"]) / "LabDevice/Build/Products/Release-iphoneos/InterpreterLab.app"
          info = plistlib.loads((app / "Info.plist").read_bytes())
          assert info["CFBundleIdentifier"] == "org.interpreter.lab"
          assert info["CFBundleShortVersionString"] == "0.7.0"
          assert info["CFBundleVersion"] == "16"
          assert info["NSMicrophoneUsageDescription"]
          assert info["NSSpeechRecognitionUsageDescription"]
          print("Verified Interpreter Lab iOS .app bundle")
          PY
          mkdir -p "$RUNNER_TEMP/lab-package/Payload"
          cp -R "$RUNNER_TEMP/LabDevice/Build/Products/Release-iphoneos/InterpreterLab.app" "$RUNNER_TEMP/lab-package/Payload/"
          (cd "$RUNNER_TEMP/lab-package" && zip -qry "$RUNNER_TEMP/Interpreter-Lab-0.7.0-Build16-Unsigned.ipa" Payload)
          unzip -t "$RUNNER_TEMP/Interpreter-Lab-0.7.0-Build16-Unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Interpreter-Lab-0.7.0-Build16-Unsigned-iPhone
          path: ${{ runner.temp }}/Interpreter-Lab-0.7.0-Build16-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Run renderer in iOS Simulator
        # macOS hosted runners may need ~10 minutes just to boot the first
        # iOS simulator/test runner; test assertions themselves finish in seconds.
        timeout-minutes: 20
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -project InterpreterLab.xcodeproj -scheme InterpreterLab \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/LabSimulator" \
            -resultBundlePath "$RUNNER_TEMP/GraphiteRenderer.xcresult" \
            CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Graphite-Renderer-Test-Results
          path: ${{ runner.temp }}/GraphiteRenderer.xcresult
          if-no-files-found: warn
      - name: Export UI snapshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/GraphiteRenderer.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/GraphiteRenderer.xcresult" --output-path "$RUNNER_TEMP/UI-Snapshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Interpreter-Lab-UI-Snapshots
          path: ${{ runner.temp }}/UI-Snapshots
          if-no-files-found: warn
