name: Interpreter Lab iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interpreter-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check independent application boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          yml = Path("project.yml").read_text()
          assert "org.interpreter.lab" in yml
          assert "InterpreterLab" in yml
          assert "NSSpeechRecognitionUsageDescription" in yml
          assert "NSMicrophoneUsageDescription" in yml
          code = "\n".join(p.read_text() for p in Path("App").glob("*.swift"))
          assert "AVSpeechSynthesizer" in code
          assert "SFSpeechRecognizer" in code
          assert "/v1/responses" in code
          assert "api.openai.com/v1/audio" not in code
          assert "RealtimeTranslation" not in code
          assert "chatgpt.tokens.use.direct" in code
          assert "InterpreterLab.ChatGPT" in code
          assert "LabTranslator.translate" in code
          print("Lab is an independent speech-to-text / text-translation / TTS app")
          PY
      - name: Validate subscription request contract and SSE parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code = Path("App/LabTranslator.swift").read_text()
          assert '"stream": true' in code and '"store": false' in code
          assert '"input": [["role": "user", "content": bounded]]' in code
          assert "URLSession.shared.bytes(for: request)" in code
          assert "LabResponseStream" in code
          print("Sign in with ChatGPT Responses contract checked")
          PY
          swiftc App/LabResponseStream.swift Tests/StreamTests.swift -o "$RUNNER_TEMP/lab-stream-tests"
          "$RUNNER_TEMP/lab-stream-tests"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Render dedicated LAB app icon
        run: |
          swift scripts/make-icon.swift
          sips -g pixelWidth -g pixelHeight App/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: Generate iOS project
        run: xcodegen generate
      - name: Build iOS Simulator
        run: |
          xcodebuild -project InterpreterLab.xcodeproj -scheme InterpreterLab \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/LabSimulator" CODE_SIGNING_ALLOWED=NO build
      - name: Build for iPhone
        run: |
          xcodebuild -project InterpreterLab.xcodeproj -scheme InterpreterLab \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/LabDevice" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify product and package unsigned IPA
        run: |
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          app = Path(os.environ["RUNNER_TEMP"]) / "LabDevice/Build/Products/Release-iphoneos/InterpreterLab.app"
          info = plistlib.loads((app / "Info.plist").read_bytes())
          assert info["CFBundleIdentifier"] == "org.interpreter.lab"
          assert info["CFBundleShortVersionString"] == "0.2.1"
          assert info["NSMicrophoneUsageDescription"]
          assert info["NSSpeechRecognitionUsageDescription"]
          print("Verified Interpreter Lab iOS .app bundle")
          PY
          mkdir -p "$RUNNER_TEMP/lab-package/Payload"
          cp -R "$RUNNER_TEMP/LabDevice/Build/Products/Release-iphoneos/InterpreterLab.app" "$RUNNER_TEMP/lab-package/Payload/"
          (cd "$RUNNER_TEMP/lab-package" && zip -qry "$RUNNER_TEMP/Interpreter-Lab-0.2.1-Unsigned.ipa" Payload)
          unzip -t "$RUNNER_TEMP/Interpreter-Lab-0.2.1-Unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Interpreter-Lab-0.2.1-Unsigned-iPhone
          path: ${{ runner.temp }}/Interpreter-Lab-0.2.1-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
