name: InterpreterLab
options:
  deploymentTarget:
    iOS: '18.4'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.7.0'
    CURRENT_PROJECT_VERSION: '16'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  InterpreterLab:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.interpreter.lab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Interpreter Lab
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Микрофон нужен для записи речи перед переводом.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Распознавание русской, немецкой, английской, испанской, румынской и польской речи перед переводом.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: []
  GraphiteRendererTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RendererTests]
    dependencies:
      - target: InterpreterLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.interpreter.lab.renderer-tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/InterpreterLab.app/InterpreterLab
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  InterpreterLab:
    build:
      targets:
        InterpreterLab: all
    test:
      targets: [GraphiteRendererTests]
