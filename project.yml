name: InterpreterLab
options:
  deploymentTarget:
    iOS: '18.4'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  InterpreterLab:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.interpreter.lab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Interpreter Lab
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Микрофон нужен для записи речи перед переводом.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Распознавание русской и немецкой речи перед переводом.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: []
schemes:
  InterpreterLab:
    build:
      targets:
        InterpreterLab: all
